[locations]
; Path to where your base game is installed
game_path = /home/mbiiez/openjk

; Path to your Movie Battles II Folder
mbii_path = /home/mbiiez/openjk/MBII

; Path to your Base Folder
base_path = /home/mbiiez/openjk/base

; Path to your instance config JSON files
config_path = /home/mbiiez/vmb2m/configs

; For multi-user setups, this file can be placed at /etc/mbii.conf
; and shared by all users. Each user can keep their own local mbii.conf
; in their repo, which is used only if /etc/mbii.conf does not exist.
;
; Example for a second user's local copy:
; game_path = /home/user2/openjk
; mbii_path = /home/user2/openjk/MBII
; base_path = /home/user2/openjk/base
; config_path = /home/user2/vmb2m/configs

[dedicated]
; Dedicated Server Engine name
engine = mbiided.i386

; MBII folder name
game = MBII
